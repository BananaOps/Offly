<svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Offly">
  <!--
    Variante pleine de la marque « créneau » pour l'icône d'application.
    Le dégradé ne vit que dans le logo (design.md §1.6) et n'emprunte que les
    deux teintes de l'interface : accent #6C4DFF vers alert #FF6FB5.
  -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C4DFF" />
      <stop offset="100%" stop-color="#FF6FB5" />
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#bgGradient)"/>

  <!-- Matin -->
  <rect x="52" y="34" width="76" height="52" rx="11" fill="white"/>
  <!-- Après-midi -->
  <rect x="52" y="94" width="76" height="52" rx="11" fill="white" opacity="0.72"/>
</svg>
