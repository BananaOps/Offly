<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Offly">
  <!--
    Marque « créneau » : les deux barres de la cellule demi-journée définie dans
    « Offly - Calendrier & saisie.dc.html » — matin au-dessus, après-midi en dessous.
    Proportions du swatch de légende (11 × 22, gouttière 2, rayon 2) mises à
    l'échelle du carré 48.
    Fond transparent : la marque se pose sur le rail (surface-2) comme sur un
    onglet clair ou sombre, sans plaque blanche qui trancherait.
    Couleurs : accent #6C4DFF et alert #FF6FB5, les deux seules teintes
    porteuses de sens dans l'interface.
  -->
  <!-- Matin -->
  <rect x="13" y="2" width="22" height="20" rx="4" fill="#6C4DFF"/>
  <!-- Après-midi -->
  <rect x="13" y="26" width="22" height="20" rx="4" fill="#FF6FB5"/>
</svg>
