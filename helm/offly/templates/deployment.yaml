apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "offly.fullname" . }}
  labels:
    {{- include "offly.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "offly.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "offly.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpc.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: STORAGE_TYPE
              value: {{ .Values.env.storageType | quote }}
            - name: MONGO_URI
              value: "mongodb://{{ .Values.env.db.host }}:{{ .Values.env.db.port }}/{{ .Values.env.db.name }}"
            - name: GRPC_PORT
              value: {{ .Values.service.grpc.port | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.http.port | quote }}
            - name: MCP_ENABLED
              value: {{ .Values.env.mcpEnabled | default false | quote }}
            {{- with .Values.auth }}
            {{- if .enabled }}
            # --- OIDC SSO (see SSO-README.md) ---
            - name: AUTH_ENABLED
              value: "true"
            - name: AUTH_ISSUER_URL
              value: {{ required "auth.issuerUrl is required when auth.enabled" .issuerUrl | quote }}
            - name: AUTH_CLIENT_ID
              value: {{ required "auth.clientId is required when auth.enabled" .clientId | quote }}
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "offly.authSecretName" $ }}
                  key: {{ .existingSecretKey | default "client-secret" }}
            - name: AUTH_REDIRECT_URL
              value: {{ printf "%s/api/v1/auth/callback" (trimSuffix "/" (required "auth.publicUrl is required when auth.enabled" .publicUrl)) | quote }}
            - name: AUTH_POST_LOGIN_REDIRECT_URL
              value: {{ printf "%s/" (trimSuffix "/" .publicUrl) | quote }}
            - name: AUTH_SCOPES
              value: {{ .scopes | quote }}
            - name: AUTH_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            - name: AUTH_ADMIN_GROUPS
              value: {{ join "," .adminGroups | quote }}
            - name: AUTH_ALLOWED_GROUPS
              value: {{ join "," .allowedGroups | quote }}
            - name: AUTH_ADMIN_EMAILS
              value: {{ join "," .adminEmails | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
