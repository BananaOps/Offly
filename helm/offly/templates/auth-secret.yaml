{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "offly.authSecretName" . }}
  labels:
    {{- include "offly.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey | default "client-secret" }}: {{ required "auth.clientSecret (or auth.existingSecret) is required when auth.enabled" .Values.auth.clientSecret | quote }}
{{- end }}
