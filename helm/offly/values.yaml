# Default values for offly.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


mongodb:
  enabled: true
  auth:
    enabled: false
  useStatefulSet: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

replicaCount: 1

# OIDC SSO with group-based RBAC — Dex, Microsoft Entra ID, Keycloak… (see SSO-README.md)
auth:
  enabled: false
  # Entra ID: https://login.microsoftonline.com/<tenant-id>/v2.0
  issuerUrl: ""
  # Entra ID: the application (client) ID of the app registration
  clientId: ""
  # Client secret: reference an existing Secret (recommended), or set it inline
  # and the chart creates the Secret (dev only).
  existingSecret: ""
  existingSecretKey: client-secret
  clientSecret: ""
  # Public URL of Offly. Redirect URI to register at the provider:
  #   <publicUrl>/api/v1/auth/callback
  publicUrl: ""
  # Entra ID does not accept a "groups" scope (groups come from the app
  # registration's "groups claim"); Dex needs it: "openid profile email groups".
  scopes: "openid profile email"
  # Claim carrying the groups (use "roles" to map Entra app roles instead).
  groupsClaim: groups
  # Groups granted the admin role (Entra ID: group object IDs).
  adminGroups: []
  # Groups allowed to log in; empty = any authenticated user of the provider.
  allowedGroups: []
  # Additional admins by email.
  adminEmails: []

# Extra environment variables for the offly container.
extraEnv: []

env:
  storageType: mongodb
  db:
    host: offly-mongodb
    port: 27017
    name: offly
  # Expose le serveur MCP (lecture seule) sur /mcp.
  # L'endpoint n'est pas authentifié : ne l'activer que derrière un réseau interne
  # ou un proxy qui porte l'authentification.
  mcpEnabled: true

image:
  repository: bananaops/offly
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  grpc:
    port: 50051
  http:
    port: 8080
  annotations: {}

ingress:
  enabled: true
  className: traefik
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: offly.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
